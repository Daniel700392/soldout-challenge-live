version: '3.8'

services:

  postgres:
    image: postgres:16

    container_name: inventory-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    container_name: inventory-redis

    ports:
      - "6379:6379"