global
    maxconn 1000

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if LOCALHOST

frontend postgres_frontend
    bind *:5432
    default_backend postgres_backend

backend postgres_backend
    option httpchk GET /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-primary patroni-primary:5432 maxconn 100 check port 8008
    server patroni-replica patroni-replica:5432 maxconn 100 check port 8008
