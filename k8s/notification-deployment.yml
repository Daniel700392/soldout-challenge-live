apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-deployment
  labels:
    app: notification-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: soldout-challenge-live-notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3005

          env:
            - name: PORT
              value: "3005"

            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq-service:5672"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10