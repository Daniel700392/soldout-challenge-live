apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway

          image: soldout-challenge-live-api-gateway:devops-v2

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:3004"

            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:3002"

            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:3003"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          